spring:
  application:
    name: routeplanner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routeplanner}
    username: ${DB_USER:routeplanner}
    password: ${DB_PASSWORD:routeplanner}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that entities match it

server:
  port: 8080
  forward-headers-strategy: framework

app:
  ml:
    base-url: ${ML_URL:http://localhost:8000}
  # Comma-separated e-mails that become ADMIN at their next login (e.g. your own account)
  admin-emails: ${ADMIN_EMAILS:}
  alert:
    # Administrator e-mail(s) for alerts (СНШ06), comma-separated; sent through the SMTP server below
    email: ${ALERT_EMAIL:}
    smtp:
      host: ${SMTP_HOST:}          # e.g. smtp.gmail.com (empty = alerts are only logged)
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}  # for Gmail: an "app password"

  google:
    # OAuth client id from Google Cloud Console ("Web application"); empty = Google login hidden
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    # At least 32 characters. Set JWT_SECRET in .env for anything other than local development.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: ${JWT_TTL:P7D}

management:
  endpoints:
    web:
      exposure:
        include: health,info
