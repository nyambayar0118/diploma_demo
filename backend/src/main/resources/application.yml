spring:
  application:
    name: routeplanner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routeplanner}
    username: ${DB_USER:routeplanner}
    password: ${DB_PASSWORD:routeplanner}
  flyway:
    enabled: true

server:
  port: 8080
  forward-headers-strategy: framework

app:
  ml:
    base-url: ${ML_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
