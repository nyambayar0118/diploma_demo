spring:
  application:
    name: routeplanner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routeplanner}
    username: ${DB_USER:routeplanner}
    password: ${DB_PASSWORD:routeplanner}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Схемийг Flyway удирдана; Hibernate зөвхөн Entity таарч байгааг шалгана

server:
  port: 8080
  forward-headers-strategy: framework

app:
  ml:
    base-url: ${ML_URL:http://localhost:8000}
  # Дараагийн нэвтрэлтээс ADMIN болох имэйлүүд, таслалаар тусгаарлана (жишээ нь өөрийн бүртгэл)
  admin-emails: ${ADMIN_EMAILS:}
  alert:
    # Анхааруулга авах администраторын имэйл (СНШ06), таслалаар тусгаарлана; доорх SMTP сервероор илгээнэ
    email: ${ALERT_EMAIL:}
    smtp:
      host: ${SMTP_HOST:}          # жишээ нь smtp.gmail.com (хоосон бол анхааруулгыг зөвхөн бүртгэлд бичнэ)
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}  # Gmail-д: "app password"

  google:
    # Google Cloud Console-оос авсан OAuth client id ("Web application"); хоосон бол Google-ээр нэвтрэх товч харагдахгүй
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    # Дор хаяж 32 тэмдэгт. Өөрийн компьютероос бусад орчинд .env-д JWT_SECRET тохируулна.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: ${JWT_TTL:P7D}

management:
  endpoints:
    web:
      exposure:
        include: health,info
