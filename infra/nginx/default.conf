# Nginx: the single entry point (API gateway) of the system.
#   /api/**   -> Spring Boot backend
#   /tiles/** -> PMTiles vector tile files (data milestone)
#   /         -> React PWA static files
server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tiles/ {
        alias /srv/tiles/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=86400";
    }

    # The service worker must never be cached, otherwise PWA updates get stuck
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # MapLibre's Web Worker is an ES module (.mjs); browsers refuse module scripts
    # unless they are served with a JavaScript MIME type.
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        default_type text/javascript;
        types { }
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
