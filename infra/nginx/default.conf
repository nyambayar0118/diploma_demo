# Nginx: системийн цорын ганц нэвтрэх цэг (API gateway).
#   /api/**   -> Spring Boot сервер
#   /tiles/** -> PMTiles вектор тайлын файл
#   /         -> React PWA-ийн статик файлууд
server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tiles/ {
        alias /srv/tiles/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=86400";
    }

    # Service worker-ийг хэзээ ч кэшлэхгүй, эс бөгөөс PWA шинэчлэгдэхгүй гацна
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # MapLibre-ийн Web Worker нь ES модуль (.mjs); JavaScript MIME төрөлтэй түгээгээгүй
    # модуль скриптийг хөтөч ажиллуулахаас татгалздаг.
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        default_type text/javascript;
        types { }
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
