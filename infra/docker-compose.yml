# Бүх систем нэг машин дээр (СНШ08). Төслийн үндсэн хавтаснаас ажиллуулна:
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
name: routeplanner

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${DB_NAME:-routeplanner}
      POSTGRES_USER: ${DB_USER:-routeplanner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-routeplanner}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # зөвхөн энэ компьютероос хандана (IntelliJ / DBeaver-т)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ml:
    build: ../ml
    expose:
      - "8000"

  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-routeplanner}
      DB_USER: ${DB_USER:-routeplanner}
      DB_PASSWORD: ${DB_PASSWORD:-routeplanner}
      ML_URL: http://ml:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    expose:
      - "8080"

  web:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ../data/tiles:/srv/tiles:ro
    depends_on:
      - backend

  # OSM-ийг нэг удаа импортлох. Ажиллуулах:
  #   docker compose -f infra/docker-compose.yml --env-file .env run --rm osm-import
  osm-import:
    build: ../data
    profiles: ["tools"]
    command: ["/data/import.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-routeplanner}
      PGUSER: ${DB_USER:-routeplanner}
      PGPASSWORD: ${DB_PASSWORD:-routeplanner}
    volumes:
      - ../data:/data
    depends_on:
      db:
        condition: service_healthy

  # OSM-ийн импорт дээр Minu Map-ийн газар нэмэх (.env-д MINU_API_TOKEN хэрэгтэй). Ажиллуулах:
  #   docker compose -f infra/docker-compose.yml --env-file .env run --rm --build minu-import
  minu-import:
    build: ../data
    profiles: ["tools"]
    command: ["/data/minu/import.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-routeplanner}
      PGUSER: ${DB_USER:-routeplanner}
      PGPASSWORD: ${DB_PASSWORD:-routeplanner}
      MINU_API_TOKEN: ${MINU_API_TOKEN:-}
      MINU_REFETCH: ${MINU_REFETCH:-0}
    volumes:
      - ../data:/data
    depends_on:
      db:
        condition: service_healthy

  # Өөрийн суурь газрын зураг: Улаанбаатарын вектор тайлыг тайрах. Ажиллуулах:
  #   docker compose -f infra/docker-compose.yml run --rm --build tiles
  tiles:
    build: ../data
    profiles: ["tools"]
    command: ["/data/tiles.sh"]
    volumes:
      - ../data:/data

volumes:
  db-data:
